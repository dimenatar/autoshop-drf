[build-system]
requires = ["setuptools", "wheel"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.git
  | \.venv
  | env
  | venv
  | migrations
  | \.pytest_cache
  | \.mypy_cache
  | build
  | dist
)/
'''

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",  # Несовместимо с black
    "E501",  # Длина строки (обрабатывается black)
    "W503",  # Разрыв оператора до оператора
]
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".venv",
    "env",
    "venv",
    "migrations",
    "settings",
    "manage.py",
    "celery.py",
    "build",
    "dist"
]
per-file-ignores = [
    "__init__.py: F401",
    "*/migrations/*: F401",
    "*/tests/*: S101"
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

exclude = [
    "migrations/",
    "tests/",
    "settings/",
    "manage.py",
    "celery.py"
]

plugins = [
    "mypy_django_plugin.main"
]

[tool.mypy.plugins.django-stubs]
django_settings_module = "core.settings"

[[tool.mypy.overrides]]
module = "rest_framework.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psycopg2.*"
ignore_missing_imports = true