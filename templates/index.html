{% extends "base.html" %}

{% block title %}Home - AutoShop{% endblock %}

{% block content %}
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="container">
        <a class="navbar-brand" href="#">
            <i class="bi bi-car-front"></i> AutoShop
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{% url 'login' %}">Login</a>
            <a class="nav-link" href="{% url 'register' %}">Register</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row align-items-center">
        <div class="col-lg-6">
            <h1 class="display-4 fw-bold mb-4">Welcome to AutoShop</h1>
            <p class="lead mb-4">The best automotive marketplace with a wide selection of cars and great deals.</p>
            <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                <a href="{% url 'register' %}" class="btn btn-primary btn-lg px-4 me-md-2">Start Shopping</a>
                <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-lg px-4">Login to Account</a>
            </div>
        </div>
        <div class="col-lg-6">
            <img src="https://via.placeholder.com/500x300/667eea/ffffff?text=AutoShop" 
                 alt="AutoShop" class="img-fluid rounded shadow">
        </div>
    </div>
</div>
{% endblock %}
