{% extends "base.html" %}

{% block title %}Password Reset - AutoShop{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2><i class="bi bi-car-front"></i> AutoShop</h2>
            <p class="mb-0">Password Recovery</p>
        </div>
        
        <div class="auth-body">
            <form id="passwordResetForm">
                {% csrf_token %}
                
                <div class="mb-4 text-center">
                    <i class="bi bi-key fs-1 text-primary mb-3 d-block"></i>
                    <p class="text-muted">Enter your email and we'll send you password reset instructions</p>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" required 
                               placeholder="your@email.com">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Send Instructions</button>
                
                <div class="text-center">
                    <a href="{% url 'login' %}" class="text-decoration-none">← Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('passwordResetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Sending...';
        submitBtn.disabled = true;
        
        const formData = {
            email: document.getElementById('email').value
        };
        
        try {
            const response = await fetch('/api/v1/auth/password/reset/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify(formData)
            });
            
            const data = await response.json();
            
            if (response.ok) {
                showAlert('Password reset instructions sent to your email!', 'success');
            } else {
                throw new Error(data.detail || 'Error sending email');
            }
        } catch (error) {
            showAlert(error.message, 'danger');
        } finally {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    });
</script>
{% endblock %}
