{% extends "base.html" %}
{% load bootstrap5 %}

{% block title %}Вход - AutoShop{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2><i class="bi bi-car-front"></i> AutoShop</h2>
            <p class="mb-0">Добро пожаловать назад!</p>
        </div>
        
        <div class="auth-body">
            <form id="loginForm">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" required 
                               placeholder="your@email.com">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required 
                               placeholder="Введите пароль">
                        <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('password')">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Запомнить меня</label>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                    <i class="bi bi-box-arrow-in-right"></i> Войти
                </button>
                
                <div class="text-center">
                    <a href="{% url 'password_reset' %}" class="text-decoration-none">Забыли пароль?</a>
                    <span class="mx-2">•</span>
                    <a href="{% url 'register' %}" class="text-decoration-none">Создать аккаунт</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
   document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const submitBtn = this.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Вход...';
    submitBtn.disabled = true;
    
    const formData = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
    };
    
    console.log('Отправляемые данные:', formData);  // Для отладки
    
    try {
        const response = await fetch('/api/v1/auth/login/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: JSON.stringify(formData)
        });
        
        const data = await response.json();
        console.log('Ответ сервера:', data);  // Для отладки
        
        if (response.ok) {
            localStorage.setItem('access_token', data.access_token || data.access);
            localStorage.setItem('refresh_token', data.refresh_token || data.refresh);
            localStorage.setItem('user', JSON.stringify(data.user));
            
            showAlert('Успешный вход! Перенаправляем...', 'success');
            setTimeout(() => {
                window.location.href = '/';
            }, 1000);
        } else {
            // Более детальная обработка ошибок
            let errorMessage = 'Ошибка входа';
            if (data.non_field_errors) {
                errorMessage = data.non_field_errors.join(', ');
            } else if (data.detail) {
                errorMessage = data.detail;
            } else if (data.email) {
                errorMessage = data.email.join(', ');
            } else if (data.password) {
                errorMessage = data.password.join(', ');
            }
            throw new Error(errorMessage);
        }
    } catch (error) {
        console.error('Ошибка входа:', error);
        showAlert(error.message, 'danger');
    } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    }
});
</script>
{% endblock %}
