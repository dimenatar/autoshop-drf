{% extends "base.html" %}

{% block title %}Password Reset Confirm - AutoShop{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2><i class="bi bi-car-front"></i> AutoShop</h2>
            <p class="mb-0">Set New Password</p>
        </div>
        
        <div class="auth-body">
            <form id="passwordResetConfirmForm">
                {% csrf_token %}
                
                <div class="mb-4 text-center">
                    <i class="bi bi-shield-lock fs-1 text-primary mb-3 d-block"></i>
                    <p class="text-muted">Enter new password for your account</p>
                </div>
                
                <div class="mb-3">
                    <label for="new_password1" class="form-label">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="new_password1" name="new_password1" required>
                        <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('new_password1')">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="form-text">Minimum 8 characters</div>
                </div>
                
                <div class="mb-3">
                    <label for="new_password2" class="form-label">Confirm New Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="new_password2" name="new_password2" required>
                        <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('new_password2')">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                    <i class="bi bi-check-circle"></i> Set New Password
                </button>
                
                <div class="text-center">
                    <a href="{% url 'login' %}" class="text-decoration-none">← Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Get uid and token from URL
    const pathSegments = window.location.pathname.split('/');
    const uid = pathSegments[pathSegments.length - 3];
    const token = pathSegments[pathSegments.length - 2];

    document.getElementById('passwordResetConfirmForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const newPassword1 = document.getElementById('new_password1').value;
        const newPassword2 = document.getElementById('new_password2').value;
        
        if (newPassword1 !== newPassword2) {
            showAlert('Passwords do not match!', 'danger');
            return;
        }
        
        if (newPassword1.length < 8) {
            showAlert('Password must be at least 8 characters', 'danger');
            return;
        }
        
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Updating...';
        submitBtn.disabled = true;
        
        const formData = {
            new_password1: newPassword1,
            new_password2: newPassword2,
            uid: uid,
            token: token
        };
        
        try {
            const response = await fetch('/api/v1/auth/password/reset/confirm/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify(formData)
            });
            
            const data = await response.json();
            
            if (response.ok) {
                showAlert('Password changed successfully! You can now login with your new password.', 'success');
                setTimeout(() => {
                    window.location.href = '{% url "login" %}';
                }, 3000);
            } else {
                const errorMessage = Object.values(data).flat().join(' ') || 'Password reset error';
                throw new Error(errorMessage);
            }
        } catch (error) {
            showAlert(error.message, 'danger');
        } finally {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    });
</script>
{% endblock %}
