{% extends "base.html" %}

{% block title %}Register - AutoShop{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2><i class="bi bi-car-front"></i> AutoShop</h2>
            <p class="mb-0">Create New Account</p>
        </div>

        <div class="auth-body">
            <form id="registerForm">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="age" class="form-label">Age</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                            <input type="number" class="form-control" id="age" name="age" min="18" max="100" value="18" required>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="telephone" class="form-label">Phone</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                        <input type="tel" class="form-control" id="telephone" name="telephone"
                               pattern="[\+\-0-9\s]{10,13}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password1" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password1" name="password1" required>
                        <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('password1')">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="form-text">Minimum 8 characters</div>
                </div>

                <div class="mb-3">
                    <label for="password2" class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="password2" name="password2" required>
                        <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('password2')">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">Role</label>
                    <select class="form-select" id="role" name="role">
                        <option value="Customer">Customer</option>
                        <option value="Admin">Administrator</option>
                    </select>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label class="form-check-label" for="terms">
                        I agree to the <a href="#" class="text-decoration-none">terms of service</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Register</button>

                <div class="text-center">
                    Already have an account? <a href="{% url 'login' %}" class="text-decoration-none">Login</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const password1 = document.getElementById('password1').value;
        const password2 = document.getElementById('password2').value;

        if (password1 !== password2) {
            showAlert('Passwords do not match!', 'danger');
            return;
        }

        if (password1.length < 8) {
            showAlert('Password must be at least 8 characters', 'danger');
            return;
        }

        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Registering...';
        submitBtn.disabled = true;

        const age = document.getElementById('age').value

        const formData = {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password1: password1,
            password2: password2,
            age: parseInt(age),
            telephone: document.getElementById('telephone').value,
            role: document.getElementById('role').value,
            balance: 0
        };

        try {
            const response = await fetch('/api/v1/auth/registration/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify(formData)
            });

            const data = await response.json();

            if (response.ok) {
                showAlert('Registration successful! Please check your email to confirm your account.', 'success');
                setTimeout(() => {
                    window.location.href = '{% url "login" %}';
                }, 3000);
            } else {
                const errorMessage = Object.values(data['errors']).flat().join("<br>") || 'Registration error';
                throw new Error(errorMessage);
            }
        } catch (error) {
            showAlert(error.message, 'danger');
        } finally {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    });

    // Phone mask
    document.getElementById('telephone').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.startsWith('7') || value.startsWith('8')) {
            value = '+7' + value.substring(1);
        }
        e.target.value = value;
    });
</script>
{% endblock %}
