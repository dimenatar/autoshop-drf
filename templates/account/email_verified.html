<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email Confirmed - AutoShop</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            line-height: 1.6; 
            color: #333;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { 
            max-width: 500px; 
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            text-align: center;
        }
        .header { 
            background: #28a745; 
            color: white; 
            padding: 40px; 
        }
        .content { 
            padding: 40px; 
        }
        .success-icon {
            font-size: 64px;
            color: #28a745;
            margin-bottom: 20px;
        }
        .button { 
            display: inline-block; 
            padding: 12px 30px; 
            background: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            margin: 20px 0; 
            transition: background 0.3s;
        }
        .button:hover {
            background: #0056b3;
        }
        .footer { 
            padding: 20px; 
            font-size: 12px; 
            color: #666;
            border-top: 1px solid #eee;
        }

</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎉 Success!</h1>
        </div>
        
        <div class="content">
            <div class="success-icon">✓</div>
            <h2>Email Confirmed!</h2>
            <p>Your email address has been successfully confirmed.</p>
            <p>You can now login to your account and enjoy all AutoShop features.</p>

            <br>
            <a href="/" style="color: #007bff; text-decoration: none;">Go to Homepage</a>
        </div>
        
        <div class="footer">
            <p>&copy; {% now "Y" %} AutoShop. All rights reserved.</p>
        </div>
